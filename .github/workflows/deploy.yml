name: Deploy LISTIA to GitHub Pages & Sync 24h

on:
  push:
    branches:
      - main
  schedule:
    # Ejecutar todos los días a las 04:00 UTC (06:00 hora peninsular de España)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sincronizar catálogo oficial de Mercadona
        run: |
          python sync_mercadona.py

      - name: Guardar catálogo actualizado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s public/mercadona-catalog.json public/mercadona-news.json) ]]; then
            git add public/mercadona-catalog.json public/mercadona-news.json
            git commit -m "Auto: Sincronización diaria del catálogo de Mercadona [skip ci]"
            git push origin main
          else
            echo "Sin cambios nuevos en el catálogo de Mercadona."
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación web PWA
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run build

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-sync
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
